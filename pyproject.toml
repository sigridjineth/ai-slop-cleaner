[project]
name = "ai-slop-cleaner"
version = "2.0.0"
description = "Agent-driven MCP server and CLI for scoring AI-slop signals in prose."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "ai-slop-cleaner maintainers" }]
dependencies = [
    "mcp[cli]>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
ai-slop-cleaner = "ai_slop_cleaner.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_slop_cleaner"]

[tool.hatch.build.targets.wheel.force-include]
"src/ai_slop_cleaner/references" = "ai_slop_cleaner/references"

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
]
